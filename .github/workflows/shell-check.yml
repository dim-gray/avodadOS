name: shell-check

on:
  push:
    paths:
      - shell/**
      - scripts/build-shell.sh
      - .github/workflows/shell-check.yml

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: ./scripts/build-shell.sh
