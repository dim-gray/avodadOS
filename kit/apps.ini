; avocadOS launcher tiles.  Format:  Tile name=program|arguments
; Environment variables such as %ProgramFiles% are expanded.
; Special commands: @wallpaper (next wallpaper), @restart, @shutdown
[Apps]
Firefox=%ProgramFiles%\Mozilla Firefox\firefox.exe|
Writer=%ProgramFiles%\LibreOffice 5\program\soffice.exe|--writer
Calc=%ProgramFiles%\LibreOffice 5\program\soffice.exe|--calc
Impress=%ProgramFiles%\LibreOffice 5\program\soffice.exe|--impress
Draw=%ProgramFiles%\LibreOffice 5\program\soffice.exe|--draw
Base=%ProgramFiles%\LibreOffice 5\program\soffice.exe|--base
Math=%ProgramFiles%\LibreOffice 5\program\soffice.exe|--math
VLC=%ProgramFiles%\VideoLAN\VLC\vlc.exe|
Notepad=notepad.exe|
Files=explorer.exe|/e,%SystemDrive%\
Terminal=cmd.exe|
Python=%SystemDrive%\Python34\python.exe|
Dev Tools=%SystemDrive%\avocadOS\devtools.html|
Wallpaper=@wallpaper
Restart=@restart
Shut down=@shutdown
